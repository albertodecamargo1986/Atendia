name: Publicar imagens Docker (GHCR)

# Gera as imagens prontas que a VPS baixa com "docker compose pull":
#   ghcr.io/albertodecamargo1986/atendia-backend:{latest,sha-<commit>}
#   ghcr.io/albertodecamargo1986/atendia-web:{latest,sha-<commit>}
# Plataformas: linux/amd64 (Google Cloud e2-micro, Hetzner, etc.) e linux/arm64 (Oracle Ampere).
#
# IMPORTANTE (uma vez só): depois da primeira publicação, marque os dois pacotes
# como PÚBLICOS em github.com/albertodecamargo1986?tab=packages -> pacote ->
# "Package settings" -> "Change visibility" -> Public. Assim o instalador baixa
# sem precisar de token. (Ver install/GUIA-INSTALACAO.md.)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'Docs/**'
      - 'install/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/albertodecamargo1986/atendia

jobs:
  publish:
    name: Build e push (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend só amd64: o arm64 via QEMU passava de 90 min (tsc + deps nativas
          # emulados). Google e2-micro e Oracle AMD micro são amd64.
          - target: backend
            platforms: linux/amd64
          - target: web
            platforms: ${{ matrix.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: QEMU (para compilar arm64)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=sha,prefix=,format=long
          labels: |
            org.opencontainers.image.title=atendia-${{ matrix.target }}
            org.opencontainers.image.description=AtendIA (${{ matrix.target }})

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false
